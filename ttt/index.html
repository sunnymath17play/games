<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>圈圈叉叉・SUNNY魔法數學</title>
<link rel="icon" href="../img/icon-192.png" />
<link rel="apple-touch-icon" href="../img/icon-180.png" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../shared/common.css" />
<style>
:root{--o:#e5484d;--x:#2f80ed}
.main{display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:center;padding:0 24px 18px;height:calc(100% - 72px)}
.team{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 18px;border-radius:28px;background:var(--card);border:5px solid transparent;transition:.3s;opacity:.55}
.team.on{opacity:1;border-color:var(--c);transform:scale(1.05);box-shadow:0 10px 30px rgba(0,0,0,.1)}
.team .mark{font-size:clamp(70px,9vw,130px);font-family:Fredoka;font-weight:700;line-height:1;color:var(--c)}
.team .name{font-size:clamp(26px,3vw,40px);font-weight:900;color:var(--c)}
.team .score{font-family:Fredoka;font-size:clamp(40px,5vw,70px);font-weight:700;color:var(--ink)}
.team .turnTxt{font-size:22px;font-weight:900;color:var(--c);min-height:30px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(64vh,46vw);aspect-ratio:1;background:var(--green);padding:14px;border-radius:30px}
.cell{background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Fredoka;position:relative;overflow:hidden}
.cell .id{font-size:clamp(30px,4vh,48px);color:#cfc8b2;font-weight:600}
.cell .star{font-size:16px;font-weight:900;color:#c08e1c;font-family:"Noto Sans TC"}
.cell.center{background:#fff6dc}
.cell .m{font-size:clamp(70px,13vh,150px);font-weight:700;line-height:1;animation:stamp .4s cubic-bezier(.2,2,.4,1)}
@keyframes stamp{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:1}}
.cell.O .m{color:var(--o)}.cell.X .m{color:var(--x)}
.cell.win{background:#fff1a8;animation:winPulse .6s infinite alternate}
@keyframes winPulse{to{background:#ffd34d}}
.cell:not(.O):not(.X):hover{background:#f3f9f0}
.cell:not(.O):not(.X):active{transform:scale(.95)}
/* 題目 */
.qov{flex-direction:column;background:rgba(255,253,247,.97);text-align:center}
.qov .who{font-size:clamp(28px,3.4vw,46px);font-weight:900}
.qov .qexpr{margin:20px 0;font-size:clamp(70px,10vw,160px);color:var(--green)}
.qov .ans{font-family:Fredoka;font-size:clamp(50px,7vw,110px);font-weight:700;color:var(--red);min-height:1.2em}
.qov .btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.timer{font-family:Fredoka;font-size:40px;font-weight:700;color:var(--green2);display:flex;align-items:center;gap:10px}
.timer .barw{width:min(500px,60vw);height:16px;background:#e6e9e1;border-radius:9px;overflow:hidden}
.timer .bar{height:100%;background:var(--gold);transition:width 1s linear}
.timer.hurry{color:var(--red)}.timer.hurry .bar{background:var(--red)}
.msg{text-align:center;font-size:26px;font-weight:900;color:var(--green2);margin-top:12px;min-height:36px}
.under{display:flex;justify-content:center;margin-top:12px}
.small{background:#fff;border:2px solid #dcd6c4;border-radius:999px;padding:6px 16px;font-size:16px;font-weight:700;color:var(--green2)}
@media (max-width:900px), (orientation:portrait){
  .main{grid-template-columns:1fr 1fr;height:auto;gap:12px}.mid{grid-column:1/3;grid-row:2}.board{width:92vw}
  .team{padding:10px;flex-direction:row;justify-content:center;flex-wrap:wrap;gap:8px}.team .turnTxt{width:100%;text-align:center;font-size:16px;min-height:0}
  .team .mark{font-size:44px}.team .name{font-size:22px}.team .score{font-size:34px}
}
</style>
</head>
<body>
<div class="top">
  <img class="logo" src="../shared/img/logo.png" alt="SUNNY魔法數學" />
  <h1>圈圈叉叉 ⭕❌</h1>
  <span class="tag" id="tag"></span>
  <span class="sp"></span>
  <button class="tbtn" id="soundBtn">🔊</button>
  <button class="tbtn fsBtn" id="fsBtn">⛶ 全螢幕</button>
  <button class="tbtn" id="setBtn">⚙️ 設定</button>
</div>

<div class="main">
  <div class="team" id="teamO" style="--c:var(--o)"><div class="mark">O</div><div class="name">圈圈隊</div><div class="score" id="scoreO">0</div><div class="turnTxt" id="turnO"></div></div>
  <div class="mid">
    <div class="board" id="board"></div>
    <div class="msg" id="msg"></div>
    <div class="under"><button class="small" id="resetBtn">🔄 這局重來</button></div>
  </div>
  <div class="team" id="teamX" style="--c:var(--x)"><div class="mark">X</div><div class="name">叉叉隊</div><div class="score" id="scoreX">0</div><div class="turnTxt" id="turnX"></div></div>
</div>

<!-- 題目 -->
<div class="ov qov" id="qOv">
  <div class="who" id="qWho"></div>
  <div class="qexpr" id="qExpr"></div>
  <div class="timer" id="timer"><span id="tNum"></span><div class="barw"><div class="bar" id="tBar"></div></div></div>
  <div class="ans" id="qAns"></div>
  <div class="btns" id="qBtns"></div>
</div>

<!-- 設定 -->
<div class="ov dim" id="setOv">
  <div class="panel">
    <h2>⭕❌ 圈圈叉叉・設定</h2>
    <div class="row"><span class="lab">年級</span><div class="seg" id="sGrade"></div></div>
    <div class="row"><span class="lab">單元</span><div class="seg" id="sTopics"></div></div>
    <div class="desc">可以複選；正中間那格是「⭐挑戰題」，數字比較大</div>
    <div class="row"><span class="lab">每題時間</span><div class="seg" id="sTime"></div></div>
    <div class="desc">兩隊輪流挑一格答題，答對才能畫上自己的 O 或 X，先連成一條線的隊伍贏！</div>
    <button class="start" id="startBtn">開始！</button>
  </div>
</div>

<script src="../shared/common.js"></script>
<script>
const KEY = 'ttt_settings';
let S = loadSettings(KEY, { grade: 3, topics: GRADE_TOPICS[3], time: 30 });
const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const NAME = { O: '圈圈隊', X: '叉叉隊' }, COLOR = { O: 'var(--o)', X: 'var(--x)' };
let score = { O: 0, X: 0 }, starter = 'O', G = {};
setupTopButtons();

// 每格答案的範圍（正中間⭐挑戰題比較大）
function answerFor(cell) {
  const base = { 3: [6, 81], 4: [12, 150], 5: [6, 60], 6: [8, 90] }[S.grade];
  return cell === 4 ? rnd(Math.round(base[1] * .6), Math.round(base[1] * 1.6)) : rnd(base[0], base[1]);
}
function newRound() {
  G = { cells: Array(9).fill(''), turn: starter, over: false };
  starter = starter === 'O' ? 'X' : 'O'; // 下一局換另一隊先
  $('tag').textContent = topicTag(S);
  draw(); msg(`${NAME[G.turn]}先！挑一格答題`);
}
function draw() {
  const b = $('board'); b.innerHTML = '';
  G.cells.forEach((v, i) => {
    const c = document.createElement('div'); c.className = 'cell' + (i === 4 ? ' center' : '') + (v ? ' ' + v : '');
    c.innerHTML = v ? `<span class="m">${v}</span>` : `<span class="id">${i + 1}</span>${i === 4 ? '<span class="star">⭐挑戰題</span>' : ''}`;
    if (!v) c.onclick = () => ask(i);
    b.appendChild(c);
  });
  ['O', 'X'].forEach(t => { $('team' + t).classList.toggle('on', !G.over && G.turn === t); $('turn' + t).textContent = !G.over && G.turn === t ? '👉 輪到我們' : ''; $('score' + t).textContent = score[t]; });
}
function msg(t) { $('msg').innerHTML = t; }

// 出題
let timerT = null;
function ask(i) {
  if (G.over) return; SFX.flip();
  const q = makeQ(answerFor(i), S.topics, S.grade);
  $('qWho').innerHTML = `<span style="color:${COLOR[G.turn]}">${NAME[G.turn]}</span> 挑第 ${i + 1} 格${i === 4 ? '・⭐挑戰題' : ''}`;
  $('qExpr').innerHTML = exprHTML(q.expr) + '<span class="expr" style="color:var(--muted)">&nbsp;= ?</span>';
  $('qAns').textContent = '';
  const btns = $('qBtns'); btns.innerHTML = '';
  const mk = (txt, cls, fn) => { const b = document.createElement('button'); b.className = 'big-btn ' + cls; b.textContent = txt; b.onclick = fn; btns.appendChild(b); };
  mk('✅ 答對', '', () => judge(i, q, true));
  mk('❌ 答錯', 'red', () => judge(i, q, false));
  mk('👀 看答案', 'white', () => { $('qAns').textContent = '答案是 ' + q.answer; });
  $('qOv').classList.add('show');
  startTimer();
}
function startTimer() {
  clearInterval(timerT); const t = $('timer');
  if (!S.time) { t.style.display = 'none'; return; }
  t.style.display = ''; let left = S.time; const bar = $('tBar');
  const show = () => { $('tNum').textContent = left; bar.style.width = (left / S.time * 100) + '%'; t.classList.toggle('hurry', left <= 5); };
  bar.style.transition = 'none'; show(); void bar.offsetWidth; bar.style.transition = '';
  timerT = setInterval(() => { left--; show(); if (left <= 5 && left > 0) SFX.tick(); if (left <= 0) { clearInterval(timerT); SFX.bad(); $('tNum').textContent = '時間到！'; } }, 1000);
}
async function judge(i, q, ok) {
  clearInterval(timerT);
  $('qAns').textContent = '答案是 ' + q.answer;
  $('qBtns').innerHTML = '';
  if (ok) SFX.ding(); else SFX.bad();
  await sleep(ok ? 900 : 1600);
  $('qOv').classList.remove('show');
  if (ok) { G.cells[i] = G.turn; SFX.place(); }
  const line = LINES.find(l => l.every(k => G.cells[k] && G.cells[k] === G.cells[l[0]]));
  if (line) return win(G.cells[line[0]], line);
  if (G.cells.every(Boolean)) { G.over = true; draw(); msg('🤝 平手！按「這局重來」再一局'); SFX.bad(); return; }
  const was = G.turn; G.turn = G.turn === 'O' ? 'X' : 'O'; draw();
  msg(ok ? `${NAME[was]}畫上 ${was}！換${NAME[G.turn]}` : `答錯了，這格還空著！換${NAME[G.turn]}`);
}
async function win(t, line) {
  G.over = true; score[t]++; draw();
  line.forEach(k => $('board').children[k].classList.add('win'));
  msg(`🎉 ${NAME[t]}連成一線！`);
  await sleep(1200);
  await celebrate(`🏆 <span style="color:${COLOR[t]}">${NAME[t]}</span> 贏了！`, `比數　圈圈隊 <span class="num">${score.O}</span> ： <span class="num">${score.X}</span> 叉叉隊`, '下一局 ▶');
  newRound();
}
$('resetBtn').onclick = () => { starter = G.turn === 'O' ? 'O' : 'X'; newRound(); };

// 設定
let T = {};
function drawSet() {
  segRow('sGrade', [[3, '三年級'], [4, '四年級'], [5, '五年級'], [6, '六年級']], T.grade, v => { T.grade = v; T.topics = GRADE_TOPICS[v].slice(); drawSet(); });
  segRow('sTopics', Object.entries(TOPICS), T.topics, v => { T.topics = T.topics.includes(v) ? T.topics.filter(x => x !== v) : [...T.topics, v]; if (!T.topics.length) T.topics = [v]; drawSet(); }, true);
  segRow('sTime', [[0, '不計時'], [20, '20 秒'], [30, '30 秒'], [60, '60 秒']], T.time, v => { T.time = v; drawSet(); });
}
$('setBtn').onclick = () => { T = JSON.parse(JSON.stringify(S)); drawSet(); $('setOv').classList.add('show'); };
$('startBtn').onclick = () => { S = T; saveSettings(KEY, S); $('setOv').classList.remove('show'); score = { O: 0, X: 0 }; starter = 'O'; newRound(); };
$('setBtn').onclick();
</script>
</body>
</html>
