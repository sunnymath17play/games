<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f0b93a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="數學遊戲盒" />
<title>SUNNY魔法數學・遊戲盒</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="img/icon-192.png" />
<link rel="apple-touch-icon" href="img/icon-180.png" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
:root{--green:#24503c;--gold:#f0b93a;--cream:#f7f4ea;--ink:#1f3a2d;--muted:#7c8a80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:
  radial-gradient(circle at 15% 0%,#fff3c4 0,transparent 45%),radial-gradient(circle at 100% 100%,#e3f1dc 0,transparent 50%),var(--cream);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer;border:none}

.head{display:flex;flex-direction:column;align-items:center;gap:6px;padding:34px 20px 10px;text-align:center}
.head .logo{height:46px}
.head h1{margin:0;font-size:clamp(34px,5vw,56px);font-weight:900;color:var(--green);letter-spacing:4px}
.grid{max-width:1000px;margin:0 auto;padding:18px 24px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:22px}
.tile{display:flex;align-items:center;gap:22px;padding:24px 26px;border-radius:30px;background:var(--c);color:#fff;text-align:left;box-shadow:0 7px 0 var(--d);transition:transform .12s}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:translateY(4px);box-shadow:0 3px 0 var(--d)}
.tile .ic{flex:none;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;font-size:54px}
.tile h2{margin:0;font-size:clamp(28px,3.2vw,38px);font-weight:900;letter-spacing:2px}
.tile p{margin:6px 0 0;font-size:clamp(17px,1.8vw,21px);font-weight:700;opacity:.95;line-height:1.45}
.foot{text-align:center;padding:10px 0 40px}
.install{background:none;border:none;color:var(--muted);font-size:16px;font-weight:700;text-decoration:underline}
/* 遊戲畫面（同一個 App 裡開，左上角回遊戲盒） */
#player{position:fixed;inset:0;background:#fff;display:none;z-index:10}
#player.show{display:block}
#player iframe{width:100%;height:100%;border:0;display:block}
#homeBtn{position:fixed;z-index:11;display:none;background:rgba(36,80,60,.88);color:#fff;font-size:15px;font-weight:700;border-radius:999px;padding:8px 14px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#player.show ~ #homeBtn{display:block}

/* 加到主畫面說明 */
.ov{position:fixed;inset:0;background:rgba(20,40,30,.55);display:none;align-items:center;justify-content:center;z-index:20}
.ov.show{display:flex}
.panel{background:#fffdf7;border-radius:26px;padding:24px 26px;max-width:460px;width:92%;font-size:18px;line-height:1.7}
.panel h3{margin:0 0 8px;color:var(--green);font-size:24px}
.panel b{color:var(--green)}
.panel button{margin-top:12px;background:var(--green);color:#fff;font-size:18px;font-weight:700;padding:10px 26px;border-radius:999px}

@media (max-width:640px){
  .head{padding:22px 16px 4px}.tile{padding:18px;gap:16px}.tile .ic{width:72px;height:72px;font-size:40px}
}
</style>
</head>
<body>

<div class="head">
  <img class="logo" src="img/logo.png" alt="SUNNY魔法數學" />
  <h1>數學遊戲盒</h1>
</div>

<div class="grid" id="grid"></div>
<div class="foot"><button class="install" id="installBtn">📲 加到主畫面</button></div>

<div id="player"><iframe id="frame" allow="fullscreen; autoplay" allowfullscreen></iframe></div>
<button id="homeBtn">🏠 回遊戲盒</button>

<div class="ov" id="howOv">
  <div class="panel" id="howText"></div>
</div>

<script>
// ===== 遊戲清單：新增遊戲就在這裡加一筆 =====
// home：「回遊戲盒」按鈕放哪個角落，避開遊戲自己的按鈕
const GAMES = [
  { id: 'password', name: '終極密碼', icon: '💣', c: '#3f7a5c', d: '#24503c', url: '../password/', line: '猜中藏起來的密碼數字，就拆彈成功！', home: 'bl' },
  { id: 'bingo', name: '數字賓果', icon: '🎯', c: '#f08c2e', d: '#b9631a', url: './bingo/', line: '算出答案圈起來，連成一條線就賓果！', home: 'bl' },
  { id: 'ttt', name: '圈圈叉叉', icon: '⭕', c: '#2f80ed', d: '#1d5bb0', url: './ttt/', line: '兩隊搶格子，答對才能畫上 O 或 X！', home: 'bl' },
  { id: 'heart', name: '心臟病', icon: '💓', c: '#e5487a', d: '#ad2b55', url: './heart/', line: '喊的數字等於卡片答案，就趕快拍桌！', home: 'bl' },
  { id: '99', name: '九九乘法快閃', icon: '⚡', c: '#8b5cf6', d: '#6235c9', url: '../99/', line: '九九乘法翻卡練習、限時挑戰！', home: 'bl' },
];
const POS = { tl: 'top:calc(10px + env(safe-area-inset-top));left:10px', bl: 'bottom:calc(10px + env(safe-area-inset-bottom));left:10px',
              tr: 'top:calc(10px + env(safe-area-inset-top));right:10px', br: 'bottom:calc(10px + env(safe-area-inset-bottom));right:10px' };

const grid = document.getElementById('grid');
GAMES.forEach(g => {
  const b = document.createElement('button'); b.className = 'tile'; b.style.setProperty('--c', g.c); b.style.setProperty('--d', g.d);
  b.innerHTML = `<span class="ic">${g.icon}</span><span><h2>${g.name}</h2><p>${g.line}</p></span>`;
  b.onclick = () => openGame(g, true); grid.appendChild(b);
});

// ===== 開遊戲／回遊戲盒（手機返回鍵也能回來） =====
const player = document.getElementById('player'), frame = document.getElementById('frame'), homeBtn = document.getElementById('homeBtn');
let histStart = 0;
function openGame(g, push) {
  if (push) histStart = history.length;
  frame.contentWindow.location.replace(new URL(g.url, location.href).href); player.classList.add('show'); homeBtn.style.cssText = POS[g.home] || POS.bl;
  document.title = g.name.replace(/\s.*$/, '') + '・數學遊戲盒';
  if (push) history.pushState({ game: g.id }, '', '#' + g.id);
}
function closeGame() { player.classList.remove('show'); frame.contentWindow.location.replace('about:blank'); document.title = 'SUNNY魔法數學・遊戲盒'; }
// 遊戲裡換頁也會記進返回紀錄 → 一次退回到開遊戲之前
homeBtn.onclick = () => { const n = history.length - histStart; closeGame(); if (histStart && n > 0) history.go(-n); else history.replaceState(null, '', location.pathname); histStart = 0; };
window.addEventListener('popstate', () => { const g = GAMES.find(x => '#' + x.id === location.hash); g ? openGame(g, false) : closeGame(); });
{ const g = GAMES.find(x => '#' + x.id === location.hash); if (g) { history.replaceState({ game: g.id }, '', '#' + g.id); openGame(g, false); } }

// ===== 加到主畫面 =====
let deferred = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const installBtn = document.getElementById('installBtn');
if (standalone) installBtn.style.display = 'none';
installBtn.onclick = async () => {
  if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  document.getElementById('howText').innerHTML = ios
    ? '<h3>📲 加到主畫面（iPhone／iPad）</h3>1. 用 <b>Safari</b> 打開這一頁<br>2. 點下面的 <b>分享鈕</b>（方框加向上箭頭）<br>3. 往下滑，點 <b>「加入主畫面」</b><br>4. 主畫面就會出現浩克的遊戲盒圖示 🎉<br><button onclick="this.closest(\'.ov\').classList.remove(\'show\')">知道了</button>'
    : '<h3>📲 加到主畫面</h3>用 <b>Chrome</b> 打開這一頁，點右上角 <b>⋮</b> → <b>「加到主畫面」</b>或<b>「安裝應用程式」</b>。<br>電腦版 Chrome：網址列右邊的 <b>安裝圖示</b>。<br><button onclick="this.closest(\'.ov\').classList.remove(\'show\')">知道了</button>';
  document.getElementById('howOv').classList.add('show');
};
document.getElementById('howOv').onclick = e => { if (e.target.id === 'howOv') e.target.classList.remove('show'); };

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
