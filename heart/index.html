<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>心臟病・SUNNY魔法數學</title>
<link rel="icon" href="../img/icon-192.png" />
<link rel="apple-touch-icon" href="../img/icon-180.png" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../shared/common.css" />
<style>
.main{display:flex;align-items:safe center;justify-content:center;overflow:auto}
.stage{width:min(1400px,100%);padding:24px 36px 18px;display:flex;flex-direction:column;align-items:center}
.table{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;width:100%}
.count{display:flex;flex-direction:column;align-items:center;gap:12px}
.count .lab{font-size:16px;font-weight:900;color:var(--muted);letter-spacing:3px}
.count .ball{width:min(29vh,360px);height:min(29vh,360px);border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-weight:700;font-size:min(17vh,220px)}
.count .ball.beat{animation:beat .3s}
@keyframes beat{40%{transform:scale(1.1)}}
.pcol{display:flex;flex-direction:column;gap:12px}
.pcol .lab{font-size:16px;font-weight:900;color:var(--muted);letter-spacing:3px;text-align:center}
.pcard{height:min(29vh,360px);border-radius:20px;background:#fbf9f3;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.pcard .expr{font-size:clamp(60px,min(7vw,15vh),180px);color:var(--green)}
.pcard.flip{animation:flip .35s}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.pcard .res{position:absolute;right:24px;bottom:14px;font-family:Fredoka;font-size:clamp(28px,3vw,44px);font-weight:700;color:var(--red)}
.verdict{font-size:clamp(24px,2.6vw,38px);font-weight:900;height:1.4em;text-align:center;margin:10px 0 8px}
.verdict.ok{color:var(--green2)}.verdict.no{color:var(--red)}
.ctrl{display:grid;grid-template-columns:auto 1fr;gap:20px;width:100%;align-items:stretch}
.ctrl .big-btn{height:auto;min-height:96px;padding:0 34px}
.slap{position:relative;height:min(23vh,240px);border-radius:28px;background:#fff6f2;border:3px dashed #f3b3b5;color:var(--red);font-size:clamp(40px,5vw,72px);font-weight:900;letter-spacing:6px;display:flex;align-items:center;justify-content:center;gap:28px;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .1s}
.slap img{height:92%;pointer-events:none;transition:transform .08s}
.slap .emo{font-size:1.4em}
.slap.hit{background:#ffe1dc}.slap.hit img{transform:translateY(8px) scale(.94)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.stats div{text-align:center}
.stats b{display:block;font-family:Fredoka;font-size:40px;color:var(--ink);line-height:1.1}
.stats div>span{font-size:15px;font-weight:900;color:var(--muted);letter-spacing:2px}
.stats div+div{border-left:1px solid var(--line)}
.toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:18px;padding:10px 22px;font-size:24px;font-weight:900;display:none;z-index:30}
.react{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;cursor:pointer}
.react.show{display:flex;animation:reactIn .25s ease-out}
@keyframes reactIn{from{opacity:0;transform:scale(1.08)}}
.react.bad{background:#d63038}
.react.good{background:#2f8c50}
.react.miss{background:#e8821e}
.react .emo{font-size:min(26vh,220px);line-height:1;animation:throb .5s infinite alternate}
@keyframes throb{to{transform:scale(1.12)}}
.react.bad .emo{animation:crack .12s 4,throb .5s .5s infinite alternate}
@keyframes crack{25%{transform:translateX(-14px) rotate(-8deg)}75%{transform:translateX(14px) rotate(8deg)}}
.react .t1{font-size:clamp(48px,7vw,110px);font-weight:900;margin-top:10px;text-shadow:0 4px 0 rgba(0,0,0,.18)}
.react .t2{font-size:clamp(24px,3vw,44px);font-weight:900;margin-top:8px;opacity:.95}
.react .t2 .num{font-family:Fredoka;font-size:1.3em}
.shakeAll{animation:shakeAll .5s}
@keyframes shakeAll{10%,50%,90%{transform:translate(-16px,6px)}30%,70%{transform:translate(16px,-6px)}}
.flash{animation:flashBg .5s}
@keyframes flashBg{30%{background:#ffd9d9}}
@media (max-width:900px), (orientation:portrait){
  .stage{padding:18px}.table{grid-template-columns:1fr;gap:16px;justify-items:center}.pcol{width:100%}.count .ball{width:34vw;height:34vw;font-size:20vw}.pcard{height:42vw}
  .ctrl{grid-template-columns:1fr}.ctrl .big-btn{min-height:64px}.slap{height:26vh}.stats b{font-size:28px}
}
</style>
</head>
<body>
<div class="top">
  <img class="logo" src="../shared/img/logo.png" alt="SUNNY魔法數學" />
  <div class="ttl"><h1>心臟病</h1><span class="tag" id="tag"></span></div>
  <span class="sp"></span>
  <button class="tbtn" id="helpBtn">玩法說明</button>
  <button class="tbtn" id="soundBtn">🔊</button>
  <button class="tbtn fsBtn" id="fsBtn">全螢幕</button>
  <button class="tbtn" id="setBtn">設定</button>
</div>

<div class="wrap main" id="main">
  <div class="card stage">
    <div class="table">
      <div class="count"><div class="lab">大家一起喊</div><div class="ball" id="ball">–</div></div>
      <div class="pcol"><div class="lab">算式卡</div><div class="pcard" id="pcard"><span class="expr" style="color:#c9c2ad">準備</span><div class="res" id="res"></div></div></div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="ctrl">
      <button class="big-btn" id="playBtn">▶ 開始</button>
      <button class="slap" id="slapBtn"><img src="../shared/img/buzzer.png" alt="" onerror="this.outerHTML='<span class=emo>🔴</span>'">按！</button>
    </div>
    <div class="stats">
      <div><b><span id="sOk">0</span> / <span id="sGoal">5</span></b><span>拍對</span></div>
      <div><b id="sMiss">0</b><span>錯過</span></div>
      <div><b id="sBad">0</b><span>拍錯</span></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="react" id="react"><div class="emo" id="rEmo"></div><div class="t1" id="rT1"></div><div class="t2" id="rT2"></div></div>

<!-- 設定 -->
<div class="ov dim" id="setOv">
  <div class="panel">
    <h2>心臟病・設定</h2>
    <div class="row"><span class="lab">算式</span><div class="seg" id="sOps"></div></div>
    <div class="desc">都是兩個數字的計算，可以複選</div>
    <div class="row"><span class="lab">數到幾</span><div class="seg" id="sMax"></div></div>
    <div class="row"><span class="lab">速度</span><div class="seg" id="sSpeed"></div></div>
    <div class="row"><span class="lab">拍對幾次過關</span><div class="seg" id="sGoalSel"></div></div>
    <div class="row"><span class="lab">電腦一起喊</span><div class="seg" id="sVoice"></div></div>
    <div class="desc">玩法：全班跟著畫面一起喊 1、2、3…，每喊一個數字就翻一張算式卡。<br>卡片算出來剛好等於喊的數字，大家就要趕快拍手！掌控平板的人看到有人拍手就按大按鈕，電腦判斷對不對。最慢拍的、或是不該拍卻拍的人就「心臟病發作」😝</div>
    <button class="start" id="startBtn">開始！</button>
  </div>
</div>

<script src="../shared/common.js"></script>
<script>
const HELP = ['💓 心臟病怎麼玩', '眼睛要快、手要更快！', [
  ['📣', '畫面跳出數字<br>全班<b>一起大聲喊</b>'],
  ['🃏', '每喊一個數字<br>就翻出一張<br><b>算式卡</b>'],
  ['👏', '卡片的答案<br><b>等於</b>喊的數字<br>大家就<b>拍手！</b>'],
  ['<img src="../shared/img/buzzer.png" style="height:1.1em" alt="">', '掌控平板的人<br>看到有人拍手<br>就按<b>大按鈕</b>'],
  ['😝', '不一樣<b>不能拍</b><br>拍錯或最慢的人<br>「心臟病發作」'],
], '電腦會判斷拍得對不對，慢半拍也算喔！'];
const KEY = 'heart_settings';
let S = loadSettings(KEY, { ops: ALL_OPS, max: 10, speed: 3000, goal: 5, voice: 1 }); S.ops = cleanOps(S.ops);
let G = {}, beatT = null;
setupTopButtons();
const ZH = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三'];

function newGame() {
  stop();
  G = { count: 0, card: null, ok: 0, miss: 0, bad: 0, running: false, judged: false, sinceMatch: 0 };
  $('tag').textContent = opsTag(S.ops); $('sGoal').textContent = S.goal;
  $('ball').textContent = '–'; $('pcard').innerHTML = '<span class="expr" style="color:#c9c2ad">準備</span><div class="res" id="res"></div>';
  $('verdict').textContent = ''; drawScore(); $('playBtn').textContent = '▶ 開始';
}
function drawScore() { $('sOk').textContent = G.ok; $('sMiss').textContent = G.miss; $('sBad').textContent = G.bad; }

// 每一拍：數字 +1、翻一張新卡
const GRACE = 700; // 小朋友常常慢半拍：換下一張後 0.7 秒內拍，還是算拍上一張
function beat() {
  // 上一張該拍還沒拍 → 先等 0.7 秒，真的沒拍才算錯過
  if (G.card && G.card.answer === G.count && !G.judged) {
    const p = { card: G.card, count: G.count }; G.pending = p;
    setTimeout(() => {
      if (G.pending !== p) return; G.pending = null;
      G.miss++; drawScore(); stop(); BUZZ();
      react('miss', '😱', '錯過了！要拍沒拍', `${exprText(p.card.expr)} = <span class="num">${p.count}</span>，剛剛要拍手！`, 2000).then(() => { if (!G.running) { G.card = null; play(); } });
    }, GRACE);
  }
  G.count = G.count % S.max + 1; G.judged = false;
  // 大約 1/3 機率出「剛好相等」的卡；太久沒出就一定出；其他的故意出差 1、2 的陷阱
  let a;
  G.sinceMatch++;
  if (Math.random() < .33 || G.sinceMatch >= 5) { a = G.count; G.sinceMatch = 0; }
  else { do { a = Math.random() < .6 ? G.count + pick([-2, -1, 1, 2]) : rnd(1, S.max); } while (a < 1 || a > S.max || a === G.count); }
  G.card = makeQ(a, S.ops);
  const ball = $('ball'); ball.textContent = G.count; ball.classList.remove('beat'); void ball.offsetWidth; ball.classList.add('beat');
  const pc = $('pcard'); pc.innerHTML = exprHTML(G.card.expr) + '<div class="res" id="res"></div>';
  pc.classList.remove('flip'); void pc.offsetWidth; pc.classList.add('flip'); SFX.flip();
  $('verdict').textContent = '';
  if (S.voice) say(ZH[G.count] || String(G.count));
}
function say(t) {
  if (!soundOn || !window.speechSynthesis) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-TW'; u.rate = 1.3; speechSynthesis.speak(u);
}
function play() { if (G.running) return; G.running = true; $('playBtn').textContent = '⏸ 暫停'; beat(); beatT = setInterval(beat, S.speed); }
function stop() { clearInterval(beatT); beatT = null; if (G) G.running = false; $('playBtn').textContent = '▶ 繼續'; }
$('playBtn').onclick = () => { if (G.running) stop(); else play(); };

// 有人拍了
async function slap() {
  const pad = $('slapBtn'); pad.classList.add('hit'); setTimeout(() => pad.classList.remove('hit'), 150);
  if (G.pending) { // 慢半拍拍到上一張
    const p = G.pending; G.pending = null; const wasRunning = G.running; stop(); G.judged = true; SFX.slap(); SFX.ding();
    G.ok++; drawScore();
    await react('good', '👏', '拍對了！', `${exprText(p.card.expr)} = <span class="num">${p.count}</span>`, 1500);
    if (G.ok >= S.goal) { await sleep(600); await celebrate('💓 全班過關！', `拍對 <span class="num">${G.ok}</span> 次・錯過 ${G.miss} 次・拍錯 ${G.bad} 次`, '再玩一次 ▶'); newGame(); return; }
    if (wasRunning && !G.running) { G.card = null; play(); }
    return;
  }
  if (!G.card) { toast(G.count ? '已經暫停了，按「▶ 繼續」再玩' : '先按「▶ 開始」喔！'); SFX.bad(); return; }
  if (G.judged) { toast('這張已經判斷過了，等下一張！'); return; }
  const wasRunning = G.running; stop(); G.judged = true; SFX.slap();
  document.body.classList.remove('flash'); void document.body.offsetWidth; document.body.classList.add('flash');
  const hit = G.card.answer === G.count;
  $('res').textContent = `= ${G.card.answer}`;
  const v = $('verdict');
  if (hit) { G.ok++; v.className = 'verdict ok'; v.textContent = `✅ 拍對了！${G.card.answer} = ${G.count}`; SFX.ding(); }
  else { G.bad++; v.className = 'verdict no'; v.textContent = `🙅 不能拍！答案是 ${G.card.answer}，不是 ${G.count}`; BUZZ(); }
  drawScore();
  if (hit) await react('good', '👏', '拍對了！', `${exprText(G.card.expr)} = <span class="num">${G.count}</span>`, 1500);
  else await react('bad', '💔', '心臟病發作！', `${exprText(G.card.expr)} = <span class="num">${G.card.answer}</span>，不是 <span class="num">${G.count}</span>，不能拍！`, 2200);
  if (G.ok >= S.goal) { await sleep(1200); await celebrate('💓 全班過關！', `拍對 <span class="num">${G.ok}</span> 次・錯過 ${G.miss} 次・拍錯 ${G.bad} 次`, '再玩一次 ▶'); newGame(); return; }
  if (wasRunning) { await sleep(300); if (!G.running) { G.card = null; play(); } }
}
// 手指一碰到就算（不用等放開）
$('slapBtn').addEventListener('pointerdown', e => { e.preventDefault(); slap(); });
document.addEventListener('keydown', e => {
  if (document.querySelector('.ov.show')) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); slap(); }
  if (e.key === 'p' || e.key === 'P') { G.running ? stop() : play(); }
});
// 整頁大反應：拍對（綠）、拍錯（紅，心臟病發作）、錯過（橘）
let reactT = null;
function react(kind, emo, t1, t2, ms = 1900) {
  const r = $('react'); r.className = 'react ' + kind; $('rEmo').textContent = emo; $('rT1').textContent = t1; $('rT2').innerHTML = t2 || '';
  void r.offsetWidth; r.classList.add('show');
  if (kind === 'bad') { const m = $('main'); m.classList.remove('shakeAll'); void m.offsetWidth; m.classList.add('shakeAll'); }
  clearTimeout(reactT);
  return new Promise(res => { const done = () => { r.classList.remove('show'); r.onclick = null; res(); }; reactT = setTimeout(done, ms); r.onclick = () => { clearTimeout(reactT); done(); }; });
}
const BUZZ = () => { tone(150, .45, 'sawtooth', .28); tone(110, .45, 'square', .12); tone(1000, .9, 'sine', .14, .5); }; // 嗶——（心電圖拉平）
let toastT = null;
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 2200); }

// 設定
let T = {};
function drawSet() {
  segRow('sOps', Object.entries(OPS), T.ops, v => { T.ops = T.ops.includes(v) ? T.ops.filter(x => x !== v) : [...T.ops, v]; if (!T.ops.length) T.ops = [v]; drawSet(); }, true);
  segRow('sMax', [[5, '1～5'], [10, '1～10'], [13, '1～13']], T.max, v => { T.max = v; drawSet(); });
  segRow('sSpeed', [[4000, '🐢 慢'], [3000, '🚶 中'], [2000, '🐇 快']], T.speed, v => { T.speed = v; drawSet(); });
  segRow('sGoalSel', [[3, '3 次'], [5, '5 次'], [10, '10 次']], T.goal, v => { T.goal = v; drawSet(); });
  segRow('sVoice', [[1, '要'], [0, '不要']], T.voice, v => { T.voice = v; drawSet(); });
}
$('setBtn').onclick = () => { stop(); T = JSON.parse(JSON.stringify(S)); drawSet(); $('setOv').classList.add('show'); };
$('startBtn').onclick = () => { S = T; saveSettings(KEY, S); $('setOv').classList.remove('show'); newGame(); };
$('helpBtn').onclick = () => { stop(); showHelp(...HELP, '知道了'); };
newGame(); showHelp(...HELP, '知道了，開始設定 ▶').then(() => $('setBtn').onclick());
</script>
</body>
</html>
