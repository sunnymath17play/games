<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>數字賓果・SUNNY魔法數學</title>
<link rel="icon" href="../img/icon-192.png" />
<link rel="apple-touch-icon" href="../img/icon-180.png" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../shared/common.css" />
<style>
.main{display:grid;grid-template-columns:1fr 380px;gap:24px}
.stage{display:flex;flex-direction:column;padding:28px 32px}
.stage .head{display:flex;align-items:center;justify-content:space-between}
.qno{font-size:30px;font-weight:900;color:var(--green)}
.qno b{font-family:Fredoka;font-size:44px;color:var(--red);margin:0 4px}
.goal{background:#fff6dc;color:#8a5d00;border-radius:12px;padding:8px 16px;font-weight:900;font-size:17px}
.qcard{flex:1;margin:20px 0;display:flex;align-items:center;justify-content:center;border-radius:20px;background:#fbf9f3;border:2px solid var(--line)}
.qcard .expr{font-size:clamp(64px,min(10vw,20vh),220px);color:var(--green)}
.qcard.flip{animation:flip .5s}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hint{font-size:20px;color:var(--muted);font-weight:700}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.side{padding:24px 0 12px;display:flex;flex-direction:column;min-height:0}
.side .shead{display:flex;align-items:baseline;justify-content:space-between;padding:0 24px 12px;border-bottom:1px solid var(--line)}
.side .shead span{font-size:14px;color:var(--muted);font-weight:700}
.hist{flex:1;overflow:auto;min-height:0}
.hi{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid #f1ece0;font-size:30px;animation:popIn .4s}
.hi .n{color:var(--muted);font-family:Fredoka;font-size:18px;width:28px;text-align:right}
.hi .ans{margin-left:auto;font-family:Fredoka;font-weight:700;color:var(--red);font-size:28px}
/* 開場：畫格子說明 */
.intro{flex-direction:column;background:var(--cream);text-align:center;padding:20px}
.intro h2{font-size:clamp(34px,4.6vw,60px);color:var(--green);margin:0 0 10px}
.intro p{font-size:clamp(20px,2.4vw,30px);font-weight:700;margin:6px 0;line-height:1.6}
.intro p b{color:var(--red)}
.sample{display:grid;gap:6px;margin:18px auto;background:var(--green);padding:6px;border-radius:14px}
.sample span{width:min(9vh,64px);height:min(9vh,64px);background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-size:min(4.4vh,30px);font-weight:600;color:var(--green)}
.sample span.c{background:#ffe9a8;position:relative}
.sample span.c::after{content:'';position:absolute;inset:6px;border:4px solid var(--red);border-radius:50%}
/* 檢查賓果 */
.check{flex-direction:column}
.check .panel{max-width:1000px}
.ckgrid{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:start;margin-top:10px}
.ckpad{display:flex;flex-direction:column;gap:10px}
.cklist{display:flex;flex-direction:column;gap:14px}
.cklist .lab{font-size:16px;font-weight:900;color:var(--muted);letter-spacing:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:72px;align-content:flex-start}
.chip{width:72px;height:72px;border-radius:16px;background:#f4f1e8;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-size:32px;font-weight:700;position:relative;cursor:pointer}
.chip.ok{background:#e6f4ea;border-color:#3f9d5c;color:#2b7a45}
.chip.no{background:#fde8e8;border-color:var(--red);color:var(--red)}
.chip.ok::after{content:'✓';position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:#3f9d5c;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.chip.no::after{content:'✗';position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.ckres{font-size:24px;font-weight:900;min-height:36px}
.ckres.ok{color:#2b7a45}.ckres.no{color:var(--red)}
.check .btns{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:900px), (orientation:portrait){.ckgrid{grid-template-columns:1fr;justify-items:center}}
@media (max-width:900px), (orientation:portrait){
  .main{grid-template-columns:1fr}.stage{padding:18px}.qcard{min-height:180px}.side{max-height:50vh}.foot{justify-content:center}.hint{text-align:center}
}
</style>
</head>
<body>
<div class="top">
  <img class="logo" src="../shared/img/logo.png" alt="SUNNY魔法數學" />
  <div class="ttl"><h1>數字賓果</h1><span class="tag" id="tag"></span></div>
  <span class="sp"></span>
  <button class="tbtn" id="helpBtn">玩法說明</button>
  <button class="tbtn" id="soundBtn">🔊</button>
  <button class="tbtn fsBtn" id="fsBtn">全螢幕</button>
  <button class="tbtn" id="setBtn">設定</button>
</div>

<div class="wrap main">
  <div class="card stage">
    <div class="head"><div class="qno" id="qno"></div><div class="goal" id="goal"></div></div>
    <div class="qcard" id="qcard"><span class="expr" style="color:#c9c2ad">？</span></div>
    <div class="foot">
      <div class="hint" id="hint">算出答案，在自己的賓果卡上圈起來</div>
      <div class="btns">
        <button class="big-btn" id="nextBtn">下一題 ▶</button>
        <button class="big-btn gold" id="bingoBtn">有人賓果！</button>
      </div>
    </div>
  </div>
  <div class="card side">
    <div class="shead"><span class="ptitle">出過的題目</span><span>算錯可以再算一次</span></div>
    <div class="hist" id="hist"></div>
  </div>
</div>

<!-- 開場：請小朋友畫格子 -->
<div class="ov intro" id="introOv">
  <h2>🎯 數字賓果</h2>
  <p id="introText"></p>
  <div class="sample" id="sample"></div>
  <p>電腦出題 → 算出答案 → 在卡上把那個數字<b>圈起來</b><br>算錯就會圈錯格喔！連成 <b id="introLines">1</b> 條線就喊「<b>賓果！</b>」</p>
  <button class="start" id="introGo">準備好了，開始出題！</button>
</div>

<!-- 檢查賓果 -->
<div class="ov dim check" id="checkOv">
  <div class="panel">
    <h2>有人喊賓果！來檢查</h2>
    <div style="font-size:19px;font-weight:700">請他唸出連成線的數字，一個一個輸入，電腦會檢查是不是都出過</div>
    <div class="ckgrid">
      <div class="ckpad"><div class="kscreen" id="ckScreen"></div><div id="ckPad"></div></div>
      <div class="cklist">
        <div class="lab" id="ckLab"></div>
        <div class="chips" id="chips"></div>
        <div class="ckres" id="ckRes"></div>
        <div class="btns">
          <button class="big-btn" id="checkBtn">檢查</button>
          <button class="big-btn white" id="noBtn">取消，繼續玩</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 設定 -->
<div class="ov dim" id="setOv">
  <div class="panel">
    <h2>數字賓果・設定</h2>
    <div class="row"><span class="lab">算式</span><div class="seg" id="sOps"></div></div>
    <div class="desc">都是兩個數字的計算，可以複選</div>
    <div class="row"><span class="lab">賓果卡</span><div class="seg" id="sSize"></div></div>
    <div class="row"><span class="lab">幾條線賓果</span><div class="seg" id="sLines"></div></div>
    <button class="start" id="startBtn">開始！</button>
  </div>
</div>

<script src="../shared/common.js"></script>
<script>
const HELP = ['🎯 數字賓果怎麼玩', '每個人都要準備一張紙和一支筆', [
  ['✏️', '在紙上畫一個 <b>5×5</b> 的格子'],
  ['🔢', '把 <b>1～25</b> 隨便填進格子裡<br>每個數字只填一次'],
  ['🧮', '老師出一題，大家算出答案<br>在自己的格子上<b>圈起來</b>'],
  ['🎉', '圈起來的數字連成一條線<br>（橫的、直的、斜的都可以）<br>就大喊「<b>賓果！</b>」'],
  ['🔢', '老師用<b>數字鍵盤</b><br>輸入他連成線的數字<br>電腦檢查對不對'],
], '⚠️ 算錯就會圈錯格，要認真算喔！'];
const KEY = 'bingo_settings';
let S = loadSettings(KEY, { ops: ALL_OPS, size: 5, lines: 1 }); S.ops = cleanOps(S.ops);
let G = {};
setupTopButtons();

function newGame() {
  const N = S.size * S.size;
  G = { N, pool: shuffle(Array.from({ length: N }, (_, i) => i + 1)), called: [], seen: new Set() };
  $('tag').textContent = opsTag(S.ops);
  $('goal').textContent = `${S.size}×${S.size}・連 ${S.lines} 條線`;
  $('qno').innerHTML = '準備開始'; $('hist').innerHTML = '';
  $('qcard').innerHTML = '<span class="expr" style="color:#c9c2ad">？</span>';
  $('nextBtn').disabled = false;
  showIntro();
}
function showIntro() {
  $('introText').innerHTML = `請在紙上畫 <b>${S.size}×${S.size}</b> 的格子，把 <b>1～${G.N}</b> 隨便填進去（每個數字填一次）`;
  $('introLines').textContent = S.lines;
  const sm = $('sample'), demo = shuffle(Array.from({ length: G.N }, (_, i) => i + 1));
  sm.style.gridTemplateColumns = `repeat(${S.size},auto)`;
  sm.innerHTML = demo.map((n, i) => `<span class="${i % (S.size + 1) === 0 ? 'c' : ''}">${n}</span>`).join('');
  $('introOv').classList.add('show');
}
$('introGo').onclick = () => { $('introOv').classList.remove('show'); nextQ(); };

function nextQ() {
  if (!G.pool.length) { $('qno').innerHTML = '題目出完了！'; $('nextBtn').disabled = true; return; }
  const a = G.pool.pop();
  let q; for (let i = 0; i < 8; i++) { q = makeQ(a, S.ops); if (!G.seen.has(q.expr)) break; }
  G.seen.add(q.expr); G.called.push(q);
  const k = G.called.length;
  $('qno').innerHTML = `第 <b>${k}</b> 題`;
  const c = $('qcard'); c.innerHTML = exprHTML(q.expr) + '<span class="expr" style="color:var(--muted);margin-left:.2em">= ?</span>';
  c.classList.remove('flip'); void c.offsetWidth; c.classList.add('flip'); SFX.flip();
  const h = document.createElement('div'); h.className = 'hi';
  h.innerHTML = `<span class="n">${k}</span>${exprHTML(q.expr)}`;
  $('hist').prepend(h);
}
$('nextBtn').onclick = nextQ;
document.addEventListener('keydown', e => {
  if (document.querySelector('.ov.show')) return;
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); nextQ(); }
});

// 有人喊賓果：輸入他連成線的數字，電腦檢查是不是都出過
let ck = [], pad = null;
function drawChips(res) {
  $('ckLab').textContent = `輸入的數字（${ck.length} 個，點數字可以刪掉）`;
  $('chips').innerHTML = ck.map((n, i) => `<div class="chip ${res ? (res[i] ? 'ok' : 'no') : ''}" data-i="${i}" title="點一下刪掉">${n}</div>`).join('');
  $('chips').querySelectorAll('.chip').forEach(c => c.onclick = () => { ck.splice(+c.dataset.i, 1); $('ckRes').textContent = ''; drawChips(); });
  $('checkBtn').disabled = ck.length < S.size;
}
$('bingoBtn').onclick = () => {
  ck = []; $('ckRes').textContent = ''; $('ckRes').className = 'ckres';
  pad = keypad($('ckPad'), $('ckScreen'), { max: 2, okText: '加入', placeholder: '輸入數字', onOk: v => {
    if (v < 1 || v > G.N) { SFX.bad(); $('ckRes').className = 'ckres no'; $('ckRes').textContent = `要輸入 1～${G.N} 的數字`; return; }
    if (ck.includes(v)) { SFX.bad(); $('ckRes').className = 'ckres no'; $('ckRes').textContent = `${v} 已經輸入過了`; return; }
    ck.push(v); $('ckRes').textContent = ''; drawChips(); pad.clear();
  } });
  drawChips();
  $('checkOv').classList.add('show'); SFX.ding();
};
$('noBtn').onclick = () => { $('checkOv').classList.remove('show'); };
$('checkBtn').onclick = async () => {
  const called = new Set(G.called.map(q => q.answer));
  const res = ck.map(n => called.has(n)); drawChips(res);
  const bad = ck.filter((n, i) => !res[i]);
  if (bad.length) { SFX.bad(); $('ckRes').className = 'ckres no'; $('ckRes').textContent = `✗ ${bad.join('、')} 還沒出過，不算賓果！`; return; }
  SFX.ding(); $('ckRes').className = 'ckres ok'; $('ckRes').textContent = '✓ 全部都出過了，賓果成功！';
  await sleep(1200);
  $('checkOv').classList.remove('show');
  // 賓果成功後，題目旁邊公布答案，大家一起對
  document.querySelectorAll('#hist .hi').forEach((h, i) => { const q = G.called[G.called.length - 1 - i];
    if (!h.querySelector('.ans')) h.insertAdjacentHTML('beforeend', `<span class="ans">${q.answer}</span>`); });
  await celebrate('🎉 賓果！', `出了 <span class="num">${G.called.length}</span> 題就連線了！`, '繼續玩（看誰第二個賓果）▶');
};

// 設定
let T = {};
function drawSet() {
  segRow('sOps', Object.entries(OPS), T.ops, v => { T.ops = T.ops.includes(v) ? T.ops.filter(x => x !== v) : [...T.ops, v]; if (!T.ops.length) T.ops = [v]; drawSet(); }, true);
  segRow('sSize', [[4, '4×4（1～16）'], [5, '5×5（1～25）']], T.size, v => { T.size = v; drawSet(); });
  segRow('sLines', [[1, '1 條'], [2, '2 條'], [3, '3 條']], T.lines, v => { T.lines = v; drawSet(); });
}
function openSet() { T = JSON.parse(JSON.stringify(S)); drawSet(); $('setOv').classList.add('show'); }
$('setBtn').onclick = openSet;
$('startBtn').onclick = () => { S = T; saveSettings(KEY, S); $('setOv').classList.remove('show'); newGame(); };

$('helpBtn').onclick = () => showHelp(...HELP, '知道了');
showHelp(...HELP, '知道了，開始設定 ▶').then(openSet);
</script>
</body>
</html>
